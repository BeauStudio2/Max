name: Android app (Max Bar)

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      # The same signing key every build, so a new version installs over the old one.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: maxbar-debug-keystore-v1
      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle -p android --no-daemon --console=plain assembleDebug 2>&1 | tee build.log
      - name: Publish the installer
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MaxBar.apk
          gh release delete maxbar --yes --cleanup-tag || true
          gh release create maxbar MaxBar.apk --title "Max Bar (Android app)" \
            --notes "Build ${{ github.run_number }} from ${{ github.sha }}. On the phone, download MaxBar.apk and open it to install." --target "${{ github.sha }}"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="Android build ${{ github.run_number }} succeeded."
      - name: Report a failed build
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Android build ${{ github.run_number }} FAILED."
            echo
            echo '```'
            grep -n -E "error:|FAILED|What went wrong|Could not|warning: \[" -A6 build.log | head -120 || true
            echo "..."
            tail -40 build.log || true
            echo '```'
          } > body.txt
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@body.txt
